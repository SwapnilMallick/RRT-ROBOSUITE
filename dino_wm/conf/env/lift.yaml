name: lift
args: []
kwargs:
  with_velocity: false

dataset:
  _target_: "datasets.lift_dset.load_lift_slice_train_val"
  n_rollout: null
  normalize_action: ${normalize_action}
  data_path: ${oc.env:DATASET_DIR}/image224.hdf5
  split_ratio: 0.9            # unused (split comes from mask/ filter keys), kept for parity
  train_filter_key: "train"
  val_filter_key: "test"
  image_key: "agentview_image"
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 16
